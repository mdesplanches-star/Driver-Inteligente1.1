$schema: https://json-schema.org/draft/2020-12/schema
title: Driver Inteligente Task Brief
type: object
required: [task_id, title, goal, owner, allowed_files, acceptance_criteria, verification]
properties:
  task_id: { type: string, minLength: 1 }
  title: { type: string, minLength: 1 }
  goal: { type: string, minLength: 1 }
  context: { type: array, items: { type: string } }
  owner: { type: string, minLength: 1 }
  supporting_agents: { type: array, items: { type: string }, maxItems: 2 }
  allowed_files: { type: array, items: { type: string }, minItems: 1 }
  forbidden_files: { type: array, items: { type: string } }
  dependencies: { type: array, items: { type: string } }
  acceptance_criteria: { type: array, items: { type: string }, minItems: 1 }
  verification: { type: array, items: { type: string }, minItems: 1 }
  external_research_allowed: { type: boolean, default: false }
  device_test_required: { type: boolean, default: false }
additionalProperties: false
